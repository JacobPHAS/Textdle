<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Textdle</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at 50% 0%, #1b2440 0%, #080a11 55%);

    color: white;
    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;
}


/* =========================
   MAIN
========================= */

.game {
    width: min(1000px, 94vw);
    margin: auto;
    text-align: center;
    padding: 35px 0 60px;
}


h1 {
    font-size: 52px;
    letter-spacing: 6px;
    margin: 0;
}


.subtitle {
    color: #8993aa;
    margin-top: 8px;
    margin-bottom: 35px;
}


/* =========================
   STRING
========================= */

.string-box {

    min-height: 145px;

    background: rgba(10, 13, 22, .92);

    border: 2px solid #303a53;

    border-radius: 25px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 10px;

    padding: 20px;

    box-shadow:
        0 0 40px rgba(0,0,0,.5);

}


.letter {

    width: 75px;
    height: 90px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 52px;
    font-weight: bold;

    background: #151b29;

    border: 2px solid #3a465f;

    border-radius: 15px;

    animation: letterIn .25s ease;

    transition: .2s;

}


.letter.pattern {

    transform:
        scale(1.12);

    box-shadow:
        0 0 30px white;

    border-color: white;

}


@keyframes letterIn {

    from {
        opacity: 0;
        transform: translateY(-30px) scale(.7);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================
   STATS
========================= */

.stats {

    display: flex;
    justify-content: center;

    gap: 18px;

    margin: 25px 0;

    flex-wrap: wrap;
}


.stat {

    background: #101521;

    border: 1px solid #293247;

    border-radius: 15px;

    padding: 14px 30px;

    min-width: 150px;

}


.stat-title {

    color: #7d879d;

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 2px;

}


.stat-value {

    font-size: 30px;

    font-weight: bold;

    margin-top: 5px;

}


/* =========================
   ROLL BUTTON
========================= */

button {

    border: none;

    background: white;

    color: black;

    font-size: 22px;

    font-weight: bold;

    padding: 17px 60px;

    border-radius: 15px;

    cursor: pointer;

    transition: .15s;

}


button:hover {

    transform: scale(1.06);

    box-shadow:
        0 0 30px rgba(255,255,255,.25);

}


button:active {

    transform: scale(.94);

}


button:disabled {

    opacity: .45;

    cursor: default;

    transform: none;

}


/* =========================
   COMBO POPUPS
========================= */

.combo-popup {

    position: fixed;

    pointer-events: none;

    z-index: 1000;

    font-size: 26px;

    font-weight: bold;

    text-shadow:
        0 0 10px black,
        0 0 20px currentColor;

    animation:
        popup 1.5s ease forwards;

}


.combo-popup.big {

    font-size: 38px;

}


.combo-popup.mega {

    font-size: 52px;

}


@keyframes popup {

    0% {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.5)
            rotate(-5deg);

    }

    15% {

        opacity: 1;

        transform:
            translateY(0)
            scale(1.15)
            rotate(0);

    }

    70% {

        opacity: 1;

    }

    100% {

        opacity: 0;

        transform:
            translateY(-80px)
            scale(1.1);

    }

}


/* =========================
   COMBO DISPLAY
========================= */

.combo-display {

    margin-top: 25px;

    min-height: 70px;

}


.combo-number {

    font-size: 42px;

    font-weight: bold;

    text-shadow:
        0 0 20px rgba(255,255,255,.5);

}


.multiplier {

    color: #aeb8cf;

}


/* =========================
   HISTORY
========================= */

.history {

    margin-top: 40px;

    background: rgba(10,13,22,.7);

    border: 1px solid #252d40;

    border-radius: 20px;

    padding: 20px;

}


.history h2 {

    margin-top: 0;

}


.history-list {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

}


.history-item {

    background: #151b29;

    border: 1px solid #303a52;

    padding: 8px 12px;

    border-radius: 8px;

    font-family: monospace;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    h1 {
        font-size: 38px;
    }

    .string-box {
        gap: 5px;
        padding: 12px;
    }

    .letter {
        width: 39px;
        height: 60px;
        font-size: 30px;
    }

    .stat {
        min-width: 110px;
        padding: 12px;
    }

}

</style>

</head>


<body>


<div class="game">


<h1>TEXTDLE</h1>

<div class="subtitle">
Roll letters. Find patterns. Build the combo.
</div>


<div
    class="string-box"
    id="stringBox"
>

<span style="color:#667085;">
    PRESS ROLL
</span>

</div>


<div class="stats">


<div class="stat">

<div class="stat-title">
Score
</div>

<div
    class="stat-value"
    id="score"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Combo
</div>

<div
    class="stat-value"
    id="combo"
>
0
</div>

</div>


<div class="stat">

<div class="stat-title">
Best Combo
</div>

<div
    class="stat-value"
    id="bestCombo"
>
0
</div>

</div>


</div>


<button
    id="rollButton"
    onclick="roll()"
>
ROLL
</button>


<div class="combo-display">

<div
    class="combo-number"
    id="comboText"
>
READY?
</div>

<div
    class="multiplier"
    id="multiplierText"
>
x1 multiplier
</div>

</div>


<div class="history">

<h2>
Roll History
</h2>

<div
    class="history-list"
    id="historyList"
>
</div>

</div>


</div>


<script>


/* =========================
   GAME VARIABLES
========================= */

const letters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


let score = 0;

let combo = 0;

let bestCombo = 0;

let audioContext = null;


/* =========================
   RANDOM STRING
========================= */

function generateString(length = 8) {

    let result = "";

    for(
        let i = 0;
        i < length;
        i++
    ) {

        result +=
            letters[
                Math.floor(
                    Math.random() *
                    letters.length
                )
            ];

    }

    return result;
}


/* =========================
   AUDIO
========================= */

function getAudio() {

    if(!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    return audioContext;

}


function playTone(
    frequency,
    duration = .12,
    type = "sine"
) {

    try {

        const audio =
            getAudio();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.type = type;

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            .08,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime + duration
        );

        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + duration
        );

    }

    catch(e) {}

}


function patternSound(power) {

    playTone(
        350 + power * 80,
        .15,
        "square"
    );

}


function comboSound(combo) {

    playTone(
        400 + combo * 70,
        .2,
        "sawtooth"
    );

}


/* =========================
   SHOW STRING
========================= */

async function showString(str) {

    const box =
        document.getElementById(
            "stringBox"
        );

    box.innerHTML = "";


    for(const char of str) {

        const letter =
            document.createElement("div");

        letter.className =
            "letter";

        letter.textContent =
            char;

        box.appendChild(
            letter
        );


        playTone(
            250,
            .06,
            "sine"
        );


        await sleep(100);

    }

}


/* =========================
   PATTERN DETECTION
========================= */

function detectPatterns(str) {

    const patterns = [];


    /*
    DOUBLE
    AA
    */

    for(
        let i = 0;
        i < str.length - 1;
        i++
    ) {

        if(
            str[i] === str[i + 1]
        ) {

            patterns.push({

                name:
                    "DOUBLE LETTER",

                points:
                    100,

                power:
                    1

            });

        }

    }


    /*
    TRIPLE
    AAA
    */

    for(
        let i = 0;
        i < str.length - 2;
        i++
    ) {

        if(
            str[i] === str[i + 1] &&
            str[i] === str[i + 2]
        ) {

            patterns.push({

                name:
                    "TRIPLE LETTER",

                points:
                    500,

                power:
                    3

            });

        }

    }


    /*
    QUAD
    AAAA
    */

    for(
        let i = 0;
        i < str.length - 3;
        i++
    ) {

        if(
            str[i] === str[i + 1] &&
            str[i] === str[i + 2] &&
            str[i] === str[i + 3]
        ) {

            patterns.push({

                name:
                    "QUAD LETTER",

                points:
                    2000,

                power:
                    6

            });

        }

    }


    /*
    BOB
    ABA
    */

    for(
        let i = 0;
        i < str.length - 2;
        i++
    ) {

        if(
            str[i] === str[i + 2] &&
            str[i] !== str[i + 1]
        ) {

            patterns.push({

                name:
                    "BOB PATTERN",

                points:
                    750,

                power:
                    3

            });

        }

    }


    /*
    AABB
    */

    for(
        let i = 0;
        i < str.length - 3;
        i++
    ) {

        if(

            str[i] === str[i + 1] &&

            str[i + 2] === str[i + 3] &&

            str[i] !== str[i + 2]

        ) {

            patterns.push({

                name:
                    "DOUBLE DOUBLE",

                points:
                    1200,

                power:
                    4

            });

        }

    }


    /*
    ABCD
    */

    for(
        let i = 0;
        i < str.length - 3;
        i++
    ) {

        let a =
            str.charCodeAt(i);

        let b =
            str.charCodeAt(i + 1);

        let c =
            str.charCodeAt(i + 2);

        let d =
            str.charCodeAt(i + 3);


        if(

            b === a + 1 &&
            c === b + 1 &&
            d === c + 1

        ) {

            patterns.push({

                name:
                    "ALPHABET RUN",

                points:
                    1500,

                power:
                    5

            });

        }

    }


    /*
    DCBA
    */

    for(
        let i = 0;
        i < str.length - 3;
        i++
    ) {

        let a =
            str.charCodeAt(i);

        let b =
            str.charCodeAt(i + 1);

        let c =
            str.charCodeAt(i + 2);

        let d =
            str.charCodeAt(i + 3);


        if(

            b === a - 1 &&
            c === b - 1 &&
            d === c - 1

        ) {

            patterns.push({

                name:
                    "REVERSE RUN",

                points:
                    1500,

                power:
                    5

            });

        }

    }


    /*
    ABAB
    */

    for(
        let i = 0;
        i < str.length - 3;
        i++
    ) {

        if(

            str[i] === str[i + 2] &&
            str[i + 1] === str[i + 3] &&
            str[i] !== str[i + 1]

        ) {

            patterns.push({

                name:
                    "ALTERNATING",

                points:
                    1000,

                power:
                    4

            });

        }

    }


    /*
    ABCABC
    */

    for(
        let size = 1;
        size <= 3;
        size++
    ) {

        for(
            let i = 0;
            i + size * 2 <= str.length;
            i++
        ) {

            const first =
                str.slice(
                    i,
                    i + size
                );

            const second =
                str.slice(
                    i + size,
                    i + size * 2
                );


            if(
                first === second
            ) {

                patterns.push({

                    name:
                        "REPEATING BLOCK",

                    points:
                        1200,

                    power:
                        4

                });

            }

        }

    }


    /*
    PALINDROME
    */

    if(
        str ===
        str.split("")
            .reverse()
            .join("")
    ) {

        patterns.push({

            name:
                "PALINDROME",

            points:
                10000,

            power:
                10

        });

    }


    /*
    ALL UNIQUE
    */

    if(
        new Set(str).size ===
        str.length
    ) {

        patterns.push({

            name:
                "ALL UNIQUE",

            points:
                500,

            power:
                2

        });

    }


    /*
    NO VOWELS
    */

    if(
        !/[AEIOU]/.test(str)
    ) {

        patterns.push({

            name:
                "NO VOWELS",

            points:
                700,

            power:
                2

        });

    }


    /*
    ALL VOWELS
    */

    if(
        /^[AEIOU]+$/.test(str)
    ) {

        patterns.push({

            name:
                "VOWEL STORM",

            points:
                5000,

            power:
                8

        });

    }


    /*
    RARE LETTERS
    */

    let rareCount = 0;


    for(
        const char of str
    ) {

        if(
            "QXZ".includes(char)
        ) {

            rareCount++;

        }

    }


    if(
        rareCount > 0
    ) {

        patterns.push({

            name:
                rareCount >= 3
                    ? "RARE LETTER STORM"
                    : "RARE LETTER",

            points:
                rareCount * 300,

            power:
                rareCount + 1

        });

    }


    /*
    BOOKENDS
    */

    if(
        str[0] ===
        str[str.length - 1]
    ) {

        patterns.push({

            name:
                "BOOKEND MATCH",

            points:
                600,

            power:
                2

        });

    }


    /*
    MIRROR PAIR
    Example:
    ABCCBA
    */

    if(
        str[0] === str[5] &&
        str[1] === str[4] &&
        str[2] === str[3]
    ) {

        patterns.push({

            name:
                "MIRROR PATTERN",

            points:
                3500,

            power:
                7

        });

    }


    /*
    TWO PAIRS
    */

    let counts = {};

    for(
        const char of str
    ) {

        counts[char] =
            (counts[char] || 0) + 1;

    }


    let pairCount = 0;

    for(
        const char in counts
    ) {

        if(
            counts[char] === 2
        ) {

            pairCount++;

        }

    }


    if(
        pairCount >= 2
    ) {

        patterns.push({

            name:
                "MULTIPLE PAIRS",

            points:
                900,

            power:
                3

        });

    }


    return patterns;

}


/* =========================
   POPUP
========================= */

function createPopup(
    pattern,
    comboNumber
) {

    const popup =
        document.createElement(
            "div"
        );

    popup.className =
        "combo-popup";


    if(
        comboNumber >= 3
    ) {

        popup.classList.add(
            "big"
        );

    }


    if(
        comboNumber >= 6
    ) {

        popup.classList.add(
            "mega"
        );

    }


    popup.textContent =
        "✨ "
        +
        pattern.name
        +
        " +"
        +
        pattern.points;


    /*
       Keep popups away from
       the very edges of screen
    */

    const x =
        10 +
        Math.random() * 75;

    const y =
        15 +
        Math.random() * 65;


    popup.style.left =
        x + "%";

    popup.style.top =
        y + "%";


    document.body.appendChild(
        popup
    );


    setTimeout(
        () => popup.remove(),
        1500
    );

}


/* =========================
   RUN PATTERNS
========================= */

async function runPatterns(
    patterns
) {

    if(
        patterns.length === 0
    ) {

        combo = 0;

        document.getElementById(
            "comboText"
        ).textContent =
            "NO PATTERNS 😐";

        document.getElementById(
            "multiplierText"
        ).textContent =
            "x1 multiplier";

        updateStats();

        return;

    }


    for(
        const pattern of patterns
    ) {

        combo++;


        if(
            combo > bestCombo
        ) {

            bestCombo =
                combo;

        }


        /*
           Combo multiplier
        */

        const multiplier =
            Math.min(
                10,
                1 +
                Math.floor(
                    combo / 2
                )
            );


        const earned =
            pattern.points *
            multiplier;


        score += earned;


        createPopup(
            pattern,
            combo
        );


        comboSound(combo);


        document.getElementById(
            "comboText"
        ).textContent =
            "🔥 COMBO x"
            +
            combo;


        document.getElementById(
            "multiplierText"
        ).textContent =
            "x"
            +
            multiplier
            +
            " MULTIPLIER";


        updateStats();


        await sleep(400);

    }

}


/* =========================
   ROLL
========================= */

async function roll() {

    const button =
        document.getElementById(
            "rollButton"
        );


    button.disabled =
        true;


    combo = 0;


    document.getElementById(
        "comboText"
    ).textContent =
        "ROLLING...";


    document.getElementById(
        "multiplierText"
    ).textContent =
        "x1 multiplier";


    const string =
        generateString(8);


    await showString(
        string
    );


    const patterns =
        detectPatterns(
            string
        );


    await runPatterns(
        patterns
    );


    addHistory(
        string
    );


    setTimeout(
        () => {

            button.disabled =
                false;

        },

        Math.max(
            500,
            patterns.length * 400
        )

    );

}


/* =========================
   HISTORY
========================= */

function addHistory(
    string
) {

    const list =
        document.getElementById(
            "historyList"
        );


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "history-item";


    item.textContent =
        string;


    list.prepend(
        item
    );


    while(
        list.children.length > 20
    ) {

        list.removeChild(
            list.lastChild
        );

    }

}


/* =========================
   STATS
========================= */

function updateStats() {

    document.getElementById(
        "score"
    ).textContent =
        score;


    document.getElementById(
        "combo"
    ).textContent =
        combo;


    document.getElementById(
        "bestCombo"
    ).textContent =
        bestCombo;

}


/* =========================
   HELPER
========================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================
   SPACEBAR
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if(
            event.code === "Space" &&
            !document.getElementById(
                "rollButton"
            ).disabled
        ) {

            event.preventDefault();

            roll();

        }

    }
);


</script>

</body>

</html>
